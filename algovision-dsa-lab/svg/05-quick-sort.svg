<text x="28" y="42" font-family='Segoe UI,system-ui,sans-serif' font-size="26" font-weight="700" fill="#e6edf3">5 • Quick Sort</text>
<text x="28" y="68" font-family='Segoe UI,system-ui,sans-serif' font-size="14" fill="#8b949e">Pick a PIVOT, partition: smaller left, larger right — then recurse on both sides.</text>
