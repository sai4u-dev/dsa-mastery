<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/></marker></defs><text x='28' y='125' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Max-heap array [16 14 10 8 7 9 3] as a tree (parent ≥ children)</text><circle cx='200' cy='185' r='24' fill='#a371f7'/><text x='200' y='192' text-anchor='middle' font-size='16' font-weight='700' fill='#0d1117'>16</text><circle cx='120' cy='250' r='22' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='120' y='257' text-anchor='middle' font-size='15' fill='#e6edf3'>14</text><circle cx='290' cy='250' r='22' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='290' y='257' text-anchor='middle' font-size='15' fill='#e6edf3'>10</text><circle cx='80' cy='310' r='20' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='80' y='316' text-anchor='middle' font-size='14' fill='#e6edf3'>8</text><circle cx='165' cy='310' r='20' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='165' y='316' text-anchor='middle' font-size='14' fill='#e6edf3'>7</text><line x1='185' y1='205' x2='135' y2='232' stroke='#30363d' stroke-width='2'/><line x1='215' y1='205' x2='275' y2='232' stroke='#30363d' stroke-width='2'/><text x='430' y='180' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Step 1 BUILD-HEAP (bottom-up</text><text x='430' y='200' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>heapify) → O(n).</text><text x='430' y='230' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#f78166'>Step 2 swap root↔last:</text><rect x='430' y='245' width='52' height='46' rx='8' fill='#f78166' stroke='#58a6ff' stroke-width='2.5'/><text x='456.0' y='275' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>3</text><text x='456.0' y='307' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>0</text><rect x='490' y='245' width='52' height='46' rx='8' fill='#161b22' stroke='#30363d' stroke-width='1.5'/><text x='516.0' y='275' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>14</text><text x='516.0' y='307' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>1</text><rect x='550' y='245' width='52' height='46' rx='8' fill='#161b22' stroke='#30363d' stroke-width='1.5'/><text x='576.0' y='275' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>10</text><text x='576.0' y='307' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>2</text><rect x='610' y='245' width='52' height='46' rx='8' fill='#161b22' stroke='#30363d' stroke-width='1.5'/><text x='636.0' y='275' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>8</text><text x='636.0' y='307' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>3</text><rect x='670' y='245' width='52' height='46' rx='8' fill='#161b22' stroke='#30363d' stroke-width='1.5'/><text x='696.0' y='275' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>7</text><text x='696.0' y='307' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>4</text><rect x='730' y='245' width='52' height='46' rx='8' fill='#161b22' stroke='#30363d' stroke-width='1.5'/><text x='756.0' y='275' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>9</text><text x='756.0' y='307' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>5</text><rect x='790' y='245' width='52' height='46' rx='8' fill='#238636' stroke='#58a6ff' stroke-width='2.5'/><text x='816.0' y='275' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>16</text><text x='816.0' y='307' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>6</text><text x='430' y='330' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Step 3 heapify root, shrink</text><text x='430' y='350' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>heap → repeat until sorted.</text><rect x='28' y='380' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='60.0' y='410' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>3</text><text x='60.0' y='442' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>0</text><rect x='100' y='380' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='132.0' y='410' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>7</text><text x='132.0' y='442' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>1</text><rect x='172' y='380' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='204.0' y='410' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>8</text><text x='204.0' y='442' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>2</text><rect x='244' y='380' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='276.0' y='410' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>9</text><text x='276.0' y='442' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>3</text><rect x='316' y='380' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='348.0' y='410' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>10</text><text x='348.0' y='442' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>4</text><rect x='388' y='380' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='420.0' y='410' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>14</text><text x='420.0' y='442' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>5</text><rect x='460' y='380' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='492.0' y='410' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>16</text><text x='492.0' y='442' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>6</text><text x='28' y='365' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#7ee787'>Sorted ✓:</text><text x='28' y='460' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Guaranteed O(n log n), in-place, NOT stable. Powers priority queues.</text>
<text x="28" y="532" font-family='Consolas,JetBrains Mono,monospace' font-size="13" fill="#8b949e">Best/Avg/Worst O(n log n)  Space O(1)  Unstable | buildHeap + extractMax × n</text>
