<text x="28" y="42" font-family='Segoe UI,system-ui,sans-serif' font-size="26" font-weight="700" fill="#e6edf3">4 • Merge Sort</text>
<text x="28" y="68" font-family='Segoe UI,system-ui,sans-serif' font-size="14" fill="#8b949e">Divide array in half, sort halves recursively, then MERGE two sorted runs.</text>
<rect x="28" y="80" width="60" height="4" rx="2" fill="#f78166"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/></marker></defs><text x='28' y='125' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#f78166'>DIVIDE</text><text x='330' y='125' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#7ee787'>CONQUER (merge ↑)</text><text x='28' y='150' font-family='Segoe UI,system-ui,sans-serif' font-size='14' font-weight='600' fill='#e6edf3'>[38 27 43 3 9 82 10]</text><text x='28' y='180' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>[38 27 43 3]  |  [9 82 10]</text><text x='28' y='205' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>[38 27] [43 3]  |  [9 82] [10]</text><text x='28' y='230' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>[38][27] [43][3] | [9][82] [10]  ← base cases (size 1 = sorted)</text><text x='28' y='270' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#7ee787'>MERGE ↑: [27 38]  [3 43]  |  [9 82]  [10]</text><rect x='28' y='285' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='60.0' y='315' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>3</text><text x='60.0' y='347' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>0</text><rect x='100' y='285' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='132.0' y='315' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>27</text><text x='132.0' y='347' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>1</text><rect x='172' y='285' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='204.0' y='315' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>38</text><text x='204.0' y='347' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>2</text><rect x='244' y='285' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='276.0' y='315' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>43</text><text x='276.0' y='347' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>3</text><rect x='340' y='285' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='372.0' y='315' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>9</text><text x='372.0' y='347' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>0</text><rect x='412' y='285' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='444.0' y='315' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>10</text><text x='444.0' y='347' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>1</text><rect x='484' y='285' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='516.0' y='315' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>82</text><text x='516.0' y='347' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>2</text><text x='28' y='385' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#7ee787'>MERGE ↑: [3 27 38 43]  +  [9 10 82]</text><rect x='28' y='400' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='60.0' y='430' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>3</text><text x='60.0' y='462' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>0</text><rect x='100' y='400' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='132.0' y='430' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>9</text><text x='132.0' y='462' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>1</text><rect x='172' y='400' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='204.0' y='430' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>10</text><text x='204.0' y='462' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>2</text><rect x='244' y='400' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='276.0' y='430' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>27</text><text x='276.0' y='462' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>3</text><rect x='316' y='400' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='348.0' y='430' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>38</text><text x='348.0' y='462' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>4</text><rect x='388' y='400' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='420.0' y='430' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>43</text><text x='420.0' y='462' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>5</text><rect x='460' y='400' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='492.0' y='430' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>82</text><text x='492.0' y='462' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>6</text><text x='28' y='480' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Two-pointer merge is linear. Stable, O(n log n) guaranteed, needs O(n) extra space.</text>
<text x="28" y="532" font-family='Consolas,JetBrains Mono,monospace' font-size="13" fill="#8b949e">Best/Avg/Worst O(n log n)  Space O(n)  Stable ✓ | T(n) = 2T(n/2) + O(n)</text>
