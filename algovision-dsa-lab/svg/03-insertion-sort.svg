<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/></marker></defs><text x='28' y='125' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Sorted zone ■ grows → key shifts right until its slot opens</text><rect x='28' y='140' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='60.0' y='170' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>1</text><text x='60.0' y='202' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>0</text><rect x='100' y='140' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='132.0' y='170' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>2</text><text x='132.0' y='202' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>1</text><rect x='172' y='140' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='204.0' y='170' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>4</text><text x='204.0' y='202' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>2</text><rect x='244' y='140' width='64' height='46' rx='8' fill='#238636' stroke='#30363d' stroke-width='1.5'/><text x='276.0' y='170' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>5</text><text x='276.0' y='202' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>3</text><rect x='316' y='140' width='64' height='46' rx='8' fill='#f78166' stroke='#58a6ff' stroke-width='2.5'/><text x='348.0' y='170' font-family='C