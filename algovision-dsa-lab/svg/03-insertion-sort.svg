<text x="28" y="532" font-family='Consolas,JetBrains Mono,monospace' font-size="13" fill="#8b949e">Best O(n)  Avg/Worst O(n²)  Space O(1)  Stable ✓ | for i: key=a[i]; j=i-1; while j≥0 &amp; a[j]&gt;key: shift; insert</text>
