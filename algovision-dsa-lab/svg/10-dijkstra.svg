<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img">
<rect x="0" y="0" width="900" height="560" rx="16" fill="#0d1117"/>
<rect x="1" y="1" width="898" height="558" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>
<rect x="0" y="0" width="900" height="96" rx="16" fill="#d2a8ff" opacity="0.12"/>
<text x="28" y="42" font-family='Segoe UI,system-ui,sans-serif' font-size="26" font-weight="700" fill="#e6edf3">10 • Dijkstra's Shortest Path</text>
<text x="28" y="68" font-family='Segoe UI,system-ui,sans-serif' font-size="14" fill="#8b949e">Greedy + min-heap: always settle the closest unsettled node; relax its edges.</text>
<rect x="28" y="80" width="60" height="4" rx="2" fill="#d2a8ff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/></marker></defs><circle cx='120' cy='220' r='24' fill='#d2a8ff'/><text x='120' y='227' text-anchor='middle' font-size='16' font-weight='700' fill='#0d1117'>S</text><circle cx='300' cy='180' r='24' fill='#161b22' stroke='#7ee787' stroke-width='2.5'/><text x='300' y='187' text-anchor='middle' font-size='16' fill='#e6edf3'>A</text><circle cx='300' cy='300' r='24' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='300' y='307' text-anchor='middle' font-size='16' fill='#e6edf3'>B</text><circle cx='500' cy='240' r='24' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='500' y='247' text-anchor='middle' font-size='16' fill='#e6edf3'>T</text><line x1='144' y1='212' x2='276' y2='188' stroke='#7ee787' stroke-width='3'/><line x1='144' y1='232' x2='276' y2='292' stroke='#30363d' stroke-width='2'/><line x1='324' y1='188' x2='476' y2='232' stroke='#30363d' stroke-width='2'/><line x1='324' y1='292' x2='476' y2='248' stroke='#30363d' stroke-width='2'/><text x='195' y='188' font-size='13' fill='#7ee787' font-weight='700'>4</text><text x='195' y='275' font-size='13' fill='#8b949e'>2</text><text x='395' y='195' font-size='13' fill='#8b949e'>3</text><text x='395' y='290' font-size='13' fill='#8b949e'>6</text><text x='600' y='170' font-family='Segoe UI,system-ui,sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>dist table:</text><text x='600' y='195' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#7ee787'>S=0 ✓ settled</text><text x='600' y='215' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#d2a8ff'>A=4 via S ← next</text><text x='600' y='235' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>B=2 via S</text><text x='600' y='255' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>T=∞ → 7 via A</text><text x='600' y='285' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Relax: if dist[u]+w &lt; dist[v]</text><text x='600' y='305' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>update v. Pop min until T settled.</text><text x='28' y='380' font-family='Segoe UI,system-ui,sans-serif' font-size='14' font-weight='600' fill='#7ee787'>Shortest S→T = S→A→T = 4+3 = 7 ✓ (beats S→B→T = 8). Needs non-negative weights.</text><text x='28' y='420' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Priority-queue always expands the frontier's closest node — like a wavefront moving at edge-cost speed.</text><text x='28' y='450' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Use for: maps / routing / network latency. No negative edges (use Bellman-Ford then).</text>
<text x="28" y="532" font-family='Consolas,JetBrains Mono,monospace' font-size="13" fill="#8b949e">Time O((V+E) log V) heap  Space O(V) | greedy + relax; fails on negative weights</text>
</svg>