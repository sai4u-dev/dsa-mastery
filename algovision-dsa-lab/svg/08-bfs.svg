<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img">
<rect x="0" y="0" width="900" height="560" rx="16" fill="#0d1117"/>
<rect x="1" y="1" width="898" height="558" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>
<rect x="0" y="0" width="900" height="96" rx="16" fill="#a371f7" opacity="0.12"/>
<text x="28" y="42" font-family='Segoe UI,system-ui,sans-serif' font-size="26" font-weight="700" fill="#e6edf3">8 • BFS — Breadth-First Search</text>
<text x="28" y="68" font-family='Segoe UI,system-ui,sans-serif' font-size="14" fill="#8b949e">Explore level by level with a QUEUE: visit neighbours before going deeper.</text>
<rect x="28" y="80" width="60" height="4" rx="2" fill="#a371f7"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/></marker></defs><circle cx='150' cy='200' r='24' fill='#a371f7'/><text x='150' y='207' text-anchor='middle' font-size='16' font-weight='700' fill='#0d1117'>A</text><circle cx='80' cy='290' r='22' fill='#161b22' stroke='#7ee787' stroke-width='2.5'/><text x='80' y='297' text-anchor='middle' font-size='15' fill='#e6edf3'>B</text><circle cx='220' cy='290' r='22' fill='#161b22' stroke='#7ee787' stroke-width='2.5'/><text x='220' y='297' text-anchor='middle' font-size='15' fill='#e6edf3'>C</text><circle cx='60' cy='380' r='20' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='60' y='386' text-anchor='middle' font-size='14' fill='#e6edf3'>D</text><circle cx='160' cy='380' r='20' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='160' y='386' text-anchor='middle' font-size='14' fill='#e6edf3'>E</text><circle cx='260' cy='380' r='20' fill='#161b22' stroke='#30363d' stroke-width='2'/><text x='260' y='386' text-anchor='middle' font-size='14' fill='#e6edf3'>F</text><line x1='135' y1='220' x2='95' y2='270' stroke='#30363d' stroke-width='2'/><line x1='165' y1='220' x2='205' y2='270' stroke='#30363d' stroke-width='2'/><line x1='75' y1='312' x2='63' y2='360' stroke='#30363d' stroke-width='2'/><line x1='95' y1='310' x2='145' y2='362' stroke='#30363d' stroke-width='2'/><line x1='228' y1='312' x2='252' y2='360' stroke='#30363d' stroke-width='2'/><text x='400' y='160' font-family='Segoe UI,system-ui,sans-serif' font-size='15' font-weight='600' fill='#e6edf3'>Queue (FIFO) walkthrough:</text><text x='400' y='190' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>queue=[A] → visit A, push B,C</text><text x='400' y='215' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>queue=[B C] → visit B, push D,E</text><text x='400' y='240' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>queue=[C D E] → visit C, push F</text><text x='400' y='265' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>queue=[D E F] → drain ✓</text><text x='400' y='300' font-family='Segoe UI,system-ui,sans-serif' font-size='15' font-weight='600' fill='#7ee787'>Order: A → B → C → D → E → F</text><text x='400' y='330' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Shortest path on unweighted</text><text x='400' y='350' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>graphs. Uses visited set.</text><text x='28' y='450' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>Level 0: A   Level 1: B C   Level 2: D E F — wavefront expands outward.</text>
<text x="28" y="532" font-family='Consolas,JetBrains Mono,monospace' font-size="13" fill="#8b949e">Time O(V+E)  Space O(V)  Queue-based | guarantees fewest edges from source</text>
</svg>