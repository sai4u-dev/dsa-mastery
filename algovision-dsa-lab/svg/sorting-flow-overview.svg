<text x="28" y="42" font-family='Segoe UI,system-ui,sans-serif' font-size="26" font-weight="700" fill="#e6edf3">Sorting Flow — How The Visualizer Works</text>
<text x="28" y="68" font-family='Segoe UI,system-ui,sans-serif' font-size="14" fill="#8b949e">One engine, six algorithms: trace generation → SVG bar animation → step log.</text>
<rect x="28" y="80" width="60" height="4" rx="2" fill="#58a6ff"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/></marker></defs><text x='28' y='130' font-family='Segoe UI,system-ui,sans-serif' font-size='15' font-weight='600' fill='#58a6ff'>1  PICK</text><text x='28' y='152' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e6edf3'>Bubble • Selection • Insertion</text><text x='28' y='172' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e6edf3'>Merge • Quick • Heap</text><text x='250' y='130' font-family='Segoe UI,system-ui,sans-serif' font-size='15' font-weight='600' fill='#f78166'>2  TRACE</text><text x='250' y='152' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e6edf3'>Recorder logs every</text><text x='250' y='172' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e6edf3'>compare / swap / overwrite</text><text x='250' y='192' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#8b949e'>+ message per step</text><text x='480' y='130' font-family='Segoe UI,system-ui,sans-serif' font-size='15' font-weight='600' fill='#7ee787'>3  ANIMATE</text><text x='480' y='152' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e6edf3'>SVG bars re-render:</text><text x='480' y='172' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e6edf3'>orange=compare  red=swap</text><text x='480' y='192' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e6edf3'>green=sorted  purple=pivot</text><text x='700' y='130' font-family='Segoe UI,system-ui,sans-serif' font-size='15' font-weight='600' fill='#a371f7'>4  LEARN</text><text x='700' y='152' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e6edf3'>Play ▶  Step ⏭</text><text x='700' y='172' font-family='Segoe UI,system-ui,sans-serif' font-size='13' font-weight='600' fill='#e6edf3'>Shuffle  Speed  Size</text><line x1='200' y1='160' x2='235' y2='160' stroke='#58a6ff' stroke-width='2' marker-end='url(#ah)'/><line x1='430' y1='160' x2='465' y2='160' stroke='#58a6ff' stroke-width='2' marker-end='url(#ah)'/><line x1='660' y1='160' x2='685' y2='160' stroke='#58a6ff' stroke-width='2' marker-end='url(#ah)'/><rect x='28' y='240' width='64' height='46' rx='8' fill='#f78166' stroke='#58a6ff' stroke-width='2.5'/><text x='60.0' y='270' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>5</text><text x='60.0' y='302' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>0</text><rect x='100' y='240' width='64' height='46' rx='8' fill='#f78166' stroke='#58a6ff' stroke-width='2.5'/><text x='132.0' y='270' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>1</text><text x='132.0' y='302' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>1</text><rect x='172' y='240' width='64' height='46' rx='8' fill='#161b22' stroke='#30363d' stroke-width='1.5'/><text x='204.0' y='270' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>4</text><text x='204.0' y='302' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>2</text><rect x='244' y='240' width='64' height='46' rx='8' fill='#161b22' stroke='#30363d' stroke-width='1.5'/><text x='276.0' y='270' font-family='Consolas,JetBrains Mono,monospace' font-size='18' font-weight='700' fill='#e6edf3' text-anchor='middle'>2</text><text x='276.0' y='302' font-family='Consolas,JetBrains Mono,monospace' font-size='11' fill='#8b949e' text-anchor='middle'>3</text><rect x='316' y='240' width='64' height='46' rx='8' fill='#161b22' stroke='#30363d' 